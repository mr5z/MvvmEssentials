name: CI & Quality Report

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone dependencies
        run: |
          git clone --depth 1 https://github.com/mr5z/CrossUtility ../CrossUtility
          git clone --depth 1 https://github.com/mr5z/Mopups ../Mopups

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore MvvmEssentials.sln

      - name: Build
        run: dotnet build MvvmEssentials.sln --no-restore --configuration Release -p:GeneratePackageOnBuild=false

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Clone dependencies
        run: |
          git clone --depth 1 https://github.com/mr5z/CrossUtility ../CrossUtility
          git clone --depth 1 https://github.com/mr5z/Mopups ../Mopups

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore MvvmEssentials.sln

      - name: Test
        run: dotnet test MvvmEssentials.sln --no-restore --configuration Release --logger "console;verbosity=detailed" -p:GeneratePackageOnBuild=false

  quality-report:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: ci-badges
    steps:
      - uses: actions/checkout@v4

      - name: Clone dependencies
        run: |
          git clone --depth 1 https://github.com/mr5z/CrossUtility ../CrossUtility
          git clone --depth 1 https://github.com/mr5z/Mopups ../Mopups

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore MvvmEssentials.sln

      - name: Test with coverage
        run: >
          dotnet test MvvmEssentials.sln --configuration Release
          -p:GeneratePackageOnBuild=false
          --collect:"XPlat Code Coverage" --results-directory ./coverage-raw
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[Mopups]*,[CrossUtility]*"

      - name: Extract metrics
        id: metrics
        run: |
          COBERTURA=$(find ./coverage-raw -name 'coverage.cobertura.xml' | head -1)
          chmod +x extract-metrics.sh
          ./extract-metrics.sh "$COBERTURA" | tee metrics.out
          cat metrics.out >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: eab7588783a7e5c6e50f926b64f9ab1a
          filename: coverage.json
          label: coverage
          message: ${{ steps.metrics.outputs.coverage }}%
          color: brightgreen

      - name: Update complexity badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: eab7588783a7e5c6e50f926b64f9ab1a
          filename: cc.json
          label: max complexity
          message: ${{ steps.metrics.outputs.cc }}
          color: yellow

      - name: Update CRAP score badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: eab7588783a7e5c6e50f926b64f9ab1a
          filename: crap.json
          label: max crap score
          message: ${{ steps.metrics.outputs.crap }}
          color: orange

      - name: Get listed NuGet downloads
        id: downloads
        run: |
          chmod +x nuget_listed_downloads.sh
          ./nuget_listed_downloads.sh Nkraft.MvvmEssentials --ci >> "$GITHUB_OUTPUT"

      - name: Update downloads badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: eab7588783a7e5c6e50f926b64f9ab1a
          filename: downloads.json
          label: downloads
          message: ${{ steps.downloads.outputs.downloads }}
          color: blue

  publish:
    # macOS is required: the csproj only adds net10.0-ios when building on osx
    runs-on: macos-26
    needs: [ build, test ]
    if: startsWith(github.ref, 'refs/tags/')
    environment: deployment
    permissions:
      contents: read
      id-token: write   # trusted publishing (OIDC); scoped to this job only
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches csproj Version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Nkraft.MvvmEssentials.csproj | head -1)
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match csproj Version $PROJ"
            exit 1
          fi

      - name: Clone dependencies
        run: |
          git clone --depth 1 https://github.com/mr5z/CrossUtility ../CrossUtility
          git clone --depth 1 https://github.com/mr5z/Mopups ../Mopups

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # floats with dotnet 10.0.x; pin both if a release breaks

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-android

      - name: Pack
        run: dotnet pack src/Nkraft.MvvmEssentials.csproj --configuration Release --output ./nupkg

      - name: Verify package contents
        run: |
          PKG=$(ls ./nupkg/*.nupkg)
          CONTENTS=$(unzip -l "$PKG")
          echo "$CONTENTS"
          for path in \
            lib/net10.0/ \
            lib/net10.0-android \
            lib/net10.0-ios \
            analyzers/dotnet/cs/Nkraft.MvvmEssentials.SourceGenerator.dll \
            buildTransitive/Nkraft.MvvmEssentials.targets
          do
            echo "$CONTENTS" | grep -q "$path" || { echo "::error::Package is missing $path"; exit 1; }
          done
          unzip -p "$PKG" '*.nuspec'

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate